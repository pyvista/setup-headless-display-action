name: Local Testing

on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"
  push:
    tags:
      - "*"
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, macos-15, macos-14, macos-15-intel, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, windows-2025, windows-2022]
        qt: [""]
        mesa: [""]
        wm: [""]
        include:
          - os: ubuntu-22.04
            qt: "pyqt5"
          - os: ubuntu-24.04
            qt: "pyqt6"
          - os: windows-latest
            qt: "pyqt6"
            mesa: "latest"
          - os: ubuntu-latest
            qt: "pyside6"
          # the only entry that exercises the cocoa branch of tests/test_qt.py
          - os: macos-latest
            qt: "pyqt6"
          # Wayland instead of Xvfb: a headless Weston compositor, no DISPLAY
          - os: ubuntu-latest
            qt: "pyqt6"
            wm: "weston"
          - os: ubuntu-latest
            qt: "pyside6"
            wm: "weston"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Weston reruns existing os/qt combinations, so artifacts need the axis
      ARTIFACT_PREFIX: ${{ matrix.os }}-${{ matrix.qt }}${{ matrix.wm && format('-{0}', matrix.wm) || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test Action
        uses: ./
        with:
          qt: ${{ matrix.qt != '' }}
          wm: ${{ matrix.wm || 'false' }}
          mesa3d-release: ${{ matrix.mesa || '24.3.0' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyvista
      - run: python tests/test_pyvista.py
      - run: python -c "import pyvista;print(pyvista.Report())"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-sphere
          path: sphere.png
          if-no-files-found: error
      - name: Second test of PyVista
        run: python -c "import pyvista;pyvista.Cube().plot(screenshot='${{ env.ARTIFACT_PREFIX }}-cube.png')"
      - name: Test Qt
        if: matrix.qt != ''
        run: |
          set -eo pipefail
          pip install ${{ matrix.qt }} matplotlib qtpy
          QT_DEBUG_PLUGINS=1 LIBGL_DEBUG=verbose python tests/test_qt.py
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-cube
          path: ${{ env.ARTIFACT_PREFIX }}-cube.png
          if-no-files-found: error
      - name: Test Vispy Qt
        if: matrix.qt != ''
        run: |
          pip install vispy pillow pyopengl
          python tests/test_vispy_qt.py
      - uses: actions/upload-artifact@v7
        if: matrix.qt != ''
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-vispy-volume
          path: ${{ env.ARTIFACT_PREFIX }}-vispy-volume.png
      - name: Compositor log
        if: always() && matrix.wm == 'weston'
        run: cat "$WESTON_LOG" || true
        shell: bash
